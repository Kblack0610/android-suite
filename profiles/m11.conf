# Lenovo Tab M11 — Home Assistant FreeKiosk Wall Panel
#
# Turns a stock-Android Lenovo Tab M11 into an always-on HA wall panel running
# FreeKiosk (github.com/RushB-fr/freekiosk). Automates the OS-level tablet prep
# from the home-config runbook (~/dev/home/home-config/docs/wall-panels.md §1-2):
# stay-awake, screen-timeout-max, disable lock screen, and grant the kiosk webview
# the microphone permission (for the Binks voice satellite).
#
# Recommended full provisioning (barebones kiosk):
#   ./provision.sh debloat --level aggressive -S <serial>   # strip to near-stock (+ lenovo vendor list)
#   ./provision.sh config  --device m11        -S <serial>  # kiosk OS tuning (this profile)
#
# Manual steps NOT doable via ADB (see docs/kiosk-m11-m9.md):
#   - FreeKiosk start URL: https://hass.kblab.me/wall-panels/home?kiosk&BrowserID=wall-<room>
#   - FreeKiosk: set as Home app / launch on boot; change the default exit PIN (1234)
#   - Settings > Battery > Battery Protection (native charge cap — do this on the M11)

# =============================================================================
# Profile Metadata
# =============================================================================
PROFILE_NAME="m11"
PROFILE_DESCRIPTION="Lenovo Tab M11 — HA FreeKiosk wall panel (always-on)"

# =============================================================================
# Settings (wall-panel tuned)
# =============================================================================
ANIMATION_SCALE=0.5

# 1 => apply_dark_mode (dashboard-friendly)
DARK_MODE=1

# 30 min cap; stay_on_while_plugged_in (below) is the real always-on switch
SCREEN_TIMEOUT=1800000

# Never doze a wall panel
AGGRESSIVE_DOZE=0
BATTERY_SAVER_LEVEL=5

# Phase 4 enables stay-awake; the kiosk hook bumps it to mode 7 (all charging sources)
STAY_AWAKE_CHARGING=1

DEBLOAT_GOOGLE=0

# FreeKiosk package — leave blank to auto-detect (pm list packages | grep kiosk).
# Set explicitly to override, e.g. KIOSK_PACKAGE="uk.freekiosk"
KIOSK_PACKAGE=""

# =============================================================================
# Custom Settings — kiosk wall-panel lockdown
# =============================================================================
apply_custom_settings() {
    # shellcheck disable=SC1090
    source "$SUITE_DIR/settings/kiosk.sh"
    apply_kiosk_common
    log_info "M11 tip: enable Settings > Battery > Battery Protection (caps charge ~40-60%) for a 24/7 mount"
}
